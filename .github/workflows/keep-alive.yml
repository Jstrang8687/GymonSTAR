name: Keep alive

# Hits the app's health route twice a day so the database never sits idle long
# enough to be paused, and so the host is woken if it has gone to sleep.
# Set the repo variable APP_URL (Settings > Secrets and variables > Actions >
# Variables) to the live site, e.g. https://your-app.onrender.com
on:
  schedule:
    - cron: "17 6,18 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health route
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then echo "APP_URL variable is not set"; exit 1; fi
          curl --fail --silent --show-error --retry 5 --retry-delay 30 --retry-all-errors --max-time 90 "${APP_URL%/}/api/health"
